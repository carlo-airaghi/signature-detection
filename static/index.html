<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signature Detection</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1a1d21; --muted: #6b7280;
    --accent: #2563eb; --ok: #15803d; --ok-bg: #dcfce7;
    --no: #b91c1c; --no-bg: #fee2e2; --warn: #b45309; --warn-bg: #fef3c7;
    --border: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111418; --card: #1b1f26; --text: #e7eaee; --muted: #9aa3af;
      --accent: #60a5fa; --ok: #4ade80; --ok-bg: #14321f;
      --no: #f87171; --no-bg: #3a1515; --warn: #fbbf24; --warn-bg: #3a2c0d;
      --border: #2a2f37;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px;
  }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; }
  #drop {
    border: 2px dashed var(--border); border-radius: 14px; background: var(--card);
    padding: 48px 24px; text-align: center; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  #drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--card)); }
  #drop strong { color: var(--accent); }
  #drop .hint { color: var(--muted); font-size: .9rem; margin-top: 6px; }
  #status { margin: 16px 0; color: var(--muted); min-height: 1.5em; }
  .spinner { display: inline-block; width: 1em; height: 1em; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite;
    vertical-align: -2px; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .page-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px; margin-bottom: 20px;
  }
  .page-card h2 { font-size: 1.1rem; margin: 0 0 12px; }
  .answers { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .answer { display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 10px 14px; border-radius: 10px; background: var(--bg); flex-wrap: wrap; }
  .badge { font-weight: 700; padding: 3px 12px; border-radius: 999px; font-size: .9rem; }
  .badge.si { color: var(--ok); background: var(--ok-bg); }
  .badge.no { color: var(--no); background: var(--no-bg); }
  .field-row { font-size: .95rem; color: var(--muted); padding-left: 14px; }
  .warn-row { color: var(--warn); background: var(--warn-bg); padding: 8px 14px;
    border-radius: 10px; font-size: .9rem; }
  details { margin-top: 12px; }
  details summary { cursor: pointer; color: var(--accent); }
  details img { max-width: 100%; border: 1px solid var(--border); border-radius: 10px; margin-top: 10px; }
  .error { color: var(--no); background: var(--no-bg); padding: 12px 16px; border-radius: 10px; }
</style>
</head>
<body>
<main>
  <h1>Signature Detection</h1>
  <p class="sub">Trascina un documento (PDF o immagine): trovo i campi firma e ti dico se sono firmati con una firma vera — una X non conta.</p>

  <div id="drop" tabindex="0">
    <div><strong>Trascina qui il documento</strong> oppure clicca per sceglierlo</div>
    <div class="hint">PDF, PNG, JPG · max 25 MB</div>
    <input id="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff,.webp" hidden>
  </div>

  <div id="status"></div>
  <div id="results"></div>
</main>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');

drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') fileInput.click(); });
fileInput.addEventListener('change', () => { if (fileInput.files[0]) analyze(fileInput.files[0]); });

['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.add('over');
}));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.remove('over');
}));
drop.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if (f) analyze(f);
});

function badge(v) { return v ? '<span class="badge si">SÌ</span>' : '<span class="badge no">NO</span>'; }
function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

async function analyze(file) {
  resultsEl.innerHTML = '';
  statusEl.innerHTML = `<span class="spinner"></span>Analizzo <b>${esc(file.name)}</b>…`;
  const fd = new FormData();
  fd.append('file', file);
  let res, data;
  try {
    res = await fetch('/api/analyze', { method: 'POST', body: fd });
    data = await res.json();
  } catch (err) {
    statusEl.innerHTML = '';
    resultsEl.innerHTML = `<div class="error">Errore di rete: ${esc(String(err))}</div>`;
    return;
  }
  statusEl.innerHTML = '';
  if (!res.ok) {
    resultsEl.innerHTML = `<div class="error">${esc(data.detail || 'Errore sconosciuto')}</div>`;
    return;
  }
  render(data);
}

function render(data) {
  const out = [];
  for (const p of data.pages) {
    const rows = [];
    rows.push(`<div class="answer">Campo di firma trovato a pag. ${p.page} ${badge(p.field_found)}</div>`);
    if (p.field_found) {
      rows.push(`<div class="answer">Campo di firma firmato all'interno ${badge(p.all_fields_signed)}</div>`);
      for (const f of p.fields) {
        const conf = f.signature_confidence != null ? ` (confidenza ${f.signature_confidence.toFixed(2)})` : '';
        rows.push(`<div class="field-row">· ${esc(f.label)} — ${f.signed ? 'firmato' + conf : 'non firmato'}</div>`);
      }
    }
    if (p.rejected_marks.length)
      rows.push(`<div class="warn-row">⚠ ${p.rejected_marks.length} segno/i tipo X o riga ignorati: non sono firme vere</div>`);
    if (p.orphan_signatures.length)
      rows.push(`<div class="warn-row">ℹ ${p.orphan_signatures.length} firma/e trovate fuori dai campi</div>`);
    const img = p.annotated_png_base64
      ? `<details><summary>Mostra pagina annotata</summary><img src="data:image/png;base64,${p.annotated_png_base64}" alt="pagina ${p.page} annotata"></details>`
      : '';
    out.push(`<section class="page-card"><h2>Pagina ${p.page}</h2><div class="answers">${rows.join('')}</div>${img}</section>`);
  }
  resultsEl.innerHTML = out.join('');
}
</script>
</body>
</html>
